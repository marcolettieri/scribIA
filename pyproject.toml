[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "scribia"
version = "0.2.0"
description = "Incremental AI documentation system — Scriba + IA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT with Attribution Requirement" }
authors = [{ name = "M. Lettieri", email = "m.lettieri@microbees.com" }]
keywords = [
    "documentation", "AI", "claude-code", "developer-tools",
    "automation", "git", "incremental", "scribia",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
]

[project.scripts]
scribia = "scribia.cli:main"

[project.urls]
Homepage = "https://github.com/mlettieri/scribia"
Repository = "https://github.com/mlettieri/scribia"
Issues = "https://github.com/mlettieri/scribia/issues"
Changelog = "https://github.com/mlettieri/scribia/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

# ── Ruff (linting + formatting) ───────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["scribia"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
